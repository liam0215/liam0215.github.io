layout: default

<!-- _layouts/cv.html -->
{% assign pdf_url = page.cv_pdf | default: 'cv.pdf' | prepend: '/assets/pdf/' | relative_url %}
<div class="post align-items-center">
  <div class="cv">
    <object data="{{ pdf_url }}" width="100%" height="600px" type="application/pdf">
      <a href="{{ pdf_url }}">Download PDF</a>
    </object>
  </div>
</div>
